<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sourdough Monitor</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}body{margin:0;padding:16px;background:#111;color:#eee}.wrap{max-width:1100px;margin:auto}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{background:#333}.tab.active{background:#03a9f4;color:#00151d}.card{background:#1c1c1c;border:1px solid #3a3a3a;border-radius:14px;padding:16px;margin-bottom:14px}h1{font-size:1.45rem;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}.muted{color:#aaa}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0}button{padding:9px 13px;border:0;border-radius:9px;font-weight:600;cursor:pointer}.primary{background:#03a9f4;color:#00151d}.secondary{background:#555;color:#fff}.danger{background:#913f3f;color:#fff}.stage{position:relative;display:inline-block;max-width:100%;line-height:0;user-select:none;touch-action:none;background:#000}#preview{display:block;max-width:100%;height:auto}.roi{position:absolute;border:3px solid #00e5ff;box-sizing:border-box;background:rgba(0,229,255,.07);cursor:move}.handle{position:absolute;width:18px;height:18px;background:#00e5ff;border:2px solid #001;box-sizing:border-box;border-radius:50%}.nw{left:-10px;top:-10px}.ne{right:-10px;top:-10px}.sw{left:-10px;bottom:-10px}.se{right:-10px;bottom:-10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px}.g2{grid-template-columns:repeat(2,minmax(150px,1fr))}label{font-size:.8rem;color:#bbb}input,textarea,select{width:100%;box-sizing:border-box;padding:8px;border-radius:7px;border:1px solid #555;background:#111;color:#eee}textarea{min-height:90px}.status{font-size:.9rem;margin-left:auto}.ok{color:#7ee787}.err{color:#ff7b72}.hidden{display:none}.bakes{display:grid;gap:8px}.bake{border:1px solid #444;border-radius:10px;padding:10px;cursor:pointer}.bake.active{border-color:#03a9f4}.line{display:flex;justify-content:space-between;gap:10px}.rating{display:flex;gap:5px}.rating input{width:auto}.pill{background:#333;border-radius:999px;padding:3px 8px;font-size:.78rem}.phases{display:flex;flex-wrap:wrap;gap:8px}.phase{background:#444}.media a{color:#80d8ff}@media(max-width:700px){.grid,.g2{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.g2{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="tabs"><button class="tab active" data-tab="journal">Bakjournal</button><button class="tab" data-tab="camera">Kamera & ROI</button></div>
<section id="journal"><div class="card"><div class="line"><div><h1>Surdegsjournal</h1><div class="muted">Recept, process, resultat och automatiska kamera-mätningar i samma bak.</div></div><button class="primary" id="newBake">Nytt bak</button></div></div>
<div class="grid g2"><div class="card"><h2>Bak</h2><div id="bakes" class="bakes"></div></div><div class="card"><h2 id="editTitle">Välj ett bak</h2><div id="editor" class="hidden">
<div class="grid g2"><div><label>Namn</label><input id="name"></div><div><label>Status</label><input id="bstatus" disabled></div></div><h2>Recept</h2><div class="grid"><div><label>Vetemjöl g</label><input id="wheat" type="number"></div><div><label>Fullkorn/graham g</label><input id="whole" type="number"></div><div><label>Råg g</label><input id="rye" type="number"></div><div><label>Vatten g</label><input id="water" type="number"></div><div><label>Starter g</label><input id="starter" type="number"></div><div><label>Salt g</label><input id="salt" type="number"></div></div>
<h2>Process</h2><div class="grid"><div><label>Degtemp °C</label><input id="doughTemp" type="number" step="0.1"></div><div><label>Bulk rise %</label><input id="bulkRise" type="number"></div><div><label>Bulk temp °C</label><input id="bulkTemp" type="number" step="0.1"></div><div><label>Kalljäsning h</label><input id="coldProof" type="number" step="0.5"></div></div><div class="phases toolbar"><button class="phase" data-phase="starter_used">Starter använd</button><button class="phase" data-phase="bulk_start">Start bulk</button><button class="phase" data-phase="bulk_end">Slut bulk</button><button class="phase" data-phase="proof_start">Start proof</button><button class="phase" data-phase="proof_end">Slut proof</button><button class="phase" data-phase="baked">Bakad</button></div>
<h2>Resultat</h2><div class="grid"><div><label>Oven spring 1–5</label><input id="oven" type="number" min="1" max="5"></div><div><label>Crumb 1–5</label><input id="crumb" type="number" min="1" max="5"></div><div><label>Crust 1–5</label><input id="crust" type="number" min="1" max="5"></div><div><label>Smak 1–5</label><input id="flavour" type="number" min="1" max="5"></div></div><div><label>Anteckningar – vad testade du och hur gick det?</label><textarea id="notes"></textarea></div><div id="derived" class="muted"></div><div id="media" class="media muted"></div><div class="toolbar"><button class="primary" id="saveBake">Spara</button><button class="secondary" id="activateBake">Gör aktivt</button><button class="secondary" id="cloneBake">Kopiera recept</button><span id="jstatus" class="status"></span></div></div></div></div></section>
<section id="camera" class="hidden"><div class="card"><h1>Sourdough Monitor – kamerakalibrering</h1><div class="muted">Placera burken och dra den cyan rutan över området OpenCV ska analysera.</div><div class="toolbar"><button class="primary" id="refresh">Uppdatera preview</button><label><input id="auto" type="checkbox" style="width:auto"> auto 5 s</label><span id="source" class="muted"></span><span id="status" class="status"></span></div><div class="stage" id="stage"><img id="preview" alt="Kamerapreview"><div class="roi" id="roi"><i class="handle nw"></i><i class="handle ne"></i><i class="handle sw"></i><i class="handle se"></i></div></div><div class="grid"><div><label>X %</label><input id="x" type="number"></div><div><label>Y %</label><input id="y" type="number"></div><div><label>Bredd %</label><input id="w" type="number"></div><div><label>Höjd %</label><input id="h" type="number"></div></div><div class="toolbar"><button class="primary" id="saveRoi">Spara ROI</button><button class="secondary" id="reset">Återställ YAML-värden</button></div></div></section></div>
<script>
const $=id=>document.getElementById(id);let selected=null,active=null,drag=null,timer=null;
function msg(id,t,c=''){const e=$(id);e.textContent=t;e.className='status '+c}async function api(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||r.statusText);return j}function post(url,data={}){return api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}function patch(url,data){return api(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
function n(id){const v=$(id).value;return v===''?null:+v}function recipe(){return{flours:{wheat_g:n('wheat'),wholegrain_g:n('whole'),rye_g:n('rye')},water_g:n('water'),starter_g:n('starter'),salt_g:n('salt')}}function setv(id,v){$(id).value=v??''}
async function loadBakes(){const c=await api('api/config');active=c.active_bake_id;const b=await api('api/bakes');$('bakes').innerHTML=b.map(x=>`<div class="bake ${x.id===active?'active':''}" data-id="${x.id}"><div class="line"><strong>${x.name}</strong><span class="pill">${x.status}</span></div><div class="muted">${x.id} · ${new Date(x.started_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">Inga bak ännu.</div>';document.querySelectorAll('.bake').forEach(e=>e.onclick=()=>openBake(e.dataset.id))}
async function openBake(id){selected=id;const b=await api('api/bakes/'+id);$('editor').classList.remove('hidden');$('editTitle').textContent=b.name;setv('name',b.name);setv('bstatus',b.status);const f=b.recipe.flours||{};setv('wheat',f.wheat_g);setv('whole',f.wholegrain_g);setv('rye',f.rye_g);setv('water',b.recipe.water_g);setv('starter',b.recipe.starter_g);setv('salt',b.recipe.salt_g);setv('doughTemp',b.process.dough_temp_c);setv('bulkRise',b.process.bulk_rise_percent);setv('bulkTemp',b.process.bulk_temp_c);setv('coldProof',b.process.cold_proof_h);setv('oven',b.result.oven_spring);setv('crumb',b.result.crumb);setv('crust',b.result.crust);setv('flavour',b.result.flavour);setv('notes',b.notes);const flour=(+f.wheat_g||0)+(+f.wholegrain_g||0)+(+f.rye_g||0);const hyd=flour?((+b.recipe.water_g||0)/flour*100).toFixed(1):'–';const wg=flour?(((+f.wholegrain_g||0)+(+f.rye_g||0))/flour*100).toFixed(0):'–';$('derived').textContent=`Hydration ${hyd}% · Fullkorn ${wg}% · Mätpunkter ${b.measurement_summary?.n||0} · Max startertillväxt ${b.measurement_summary?.max_growth?.toFixed?.(1)||'–'}%`;$('media').innerHTML=Object.entries(b.media||{}).filter(([k,v])=>v).map(([k,v])=>`<div>${k}: ${String(v)}</div>`).join('')}
$('newBake').onclick=async()=>{const b=await post('api/bakes',{name:'Nytt surdegsbröd'});await loadBakes();openBake(b.id)};$('saveBake').onclick=async()=>{if(!selected)return;msg('jstatus','Sparar…');await patch('api/bakes/'+selected,{name:$('name').value,recipe:recipe(),process:{dough_temp_c:n('doughTemp'),bulk_rise_percent:n('bulkRise'),bulk_temp_c:n('bulkTemp'),cold_proof_h:n('coldProof')},result:{oven_spring:n('oven'),crumb:n('crumb'),crust:n('crust'),flavour:n('flavour')},notes:$('notes').value});msg('jstatus','Sparat','ok');await loadBakes();openBake(selected)};$('activateBake').onclick=async()=>{if(!selected)return;await post('api/active-bake',{id:selected});await loadBakes();msg('jstatus','Aktivt bak','ok')};$('cloneBake').onclick=async()=>{if(!selected)return;const b=await post('api/bakes/'+selected+'/clone',{});await loadBakes();openBake(b.id)};document.querySelectorAll('[data-phase]').forEach(e=>e.onclick=async()=>{if(!selected)return;await post(`api/bakes/${selected}/phase/${e.dataset.phase}`,{});openBake(selected);loadBakes()});
// ROI
const img=$('preview'),stage=$('stage'),box=$('roi');function vals(){return{roi_x_pct:+$('x').value,roi_y_pct:+$('y').value,roi_width_pct:+$('w').value,roi_height_pct:+$('h').value}}function render(){const v=vals();box.style.left=v.roi_x_pct+'%';box.style.top=v.roi_y_pct+'%';box.style.width=v.roi_width_pct+'%';box.style.height=v.roi_height_pct+'%'}function sync(v){setv('x',Math.round(v.roi_x_pct));setv('y',Math.round(v.roi_y_pct));setv('w',Math.round(v.roi_width_pct));setv('h',Math.round(v.roi_height_pct));render()}async function cfg(){const j=await api('api/config');$('source').textContent=j.camera_source+' · '+j.camera_url;sync(j)}async function refresh(){msg('status','Hämtar bild…');img.onload=()=>msg('status',img.naturalWidth+'×'+img.naturalHeight,'ok');img.onerror=()=>msg('status','Preview misslyckades','err');img.src='api/preview.jpg?t='+Date.now()}['x','y','w','h'].forEach(k=>$(k).addEventListener('input',render));box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);let mode='move';for(const c of ['nw','ne','sw','se'])if(e.target.classList.contains(c))mode=c;drag={sx:e.clientX,sy:e.clientY,start:vals(),rect:stage.getBoundingClientRect(),mode}});box.addEventListener('pointermove',e=>{if(!drag)return;let x=drag.start.roi_x_pct,y=drag.start.roi_y_pct,w=drag.start.roi_width_pct,h=drag.start.roi_height_pct,dx=(e.clientX-drag.sx)/drag.rect.width*100,dy=(e.clientY-drag.sy)/drag.rect.height*100,m=drag.mode;if(m==='move'){x+=dx;y+=dy}else{if(m.includes('w')){x+=dx;w-=dx}if(m.includes('e'))w+=dx;if(m.includes('n')){y+=dy;h-=dy}if(m.includes('s'))h+=dy}w=Math.max(5,Math.min(w,100-x));h=Math.max(5,Math.min(h,100-y));x=Math.max(0,Math.min(x,100-w));y=Math.max(0,Math.min(y,100-h));sync({roi_x_pct:x,roi_y_pct:y,roi_width_pct:w,roi_height_pct:h})});box.addEventListener('pointerup',()=>drag=null);$('refresh').onclick=refresh;$('auto').onchange=e=>{clearInterval(timer);if(e.target.checked)timer=setInterval(refresh,5000)};$('saveRoi').onclick=async()=>{sync(await post('api/roi',vals()));msg('status','ROI sparad','ok')};$('reset').onclick=async()=>{const j=await api('api/roi',{method:'DELETE'});sync(j);msg('status','Återställd','ok')};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));$('journal').classList.toggle('hidden',t.dataset.tab!=='journal');$('camera').classList.toggle('hidden',t.dataset.tab!=='camera');if(t.dataset.tab==='camera')cfg().then(refresh)});loadBakes();
</script></body></html>
